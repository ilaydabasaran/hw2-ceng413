name: ceng413-hw2
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_GREETING: ${APP_GREETING:-Hello}
      REDIS_HOST: cache
      REDIS_PORT: "6379"
    depends_on:
      cache:
        condition: service_healthy

  cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

volumes:
  redisdata: